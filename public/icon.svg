<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7830" />
      <stop offset="100%" stop-color="#2D301C" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFFF3" />
      <stop offset="100%" stop-color="#E2ECC8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />

  <!-- Outer subtle border ring -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="#FBFFF3" stroke-opacity="0.25" stroke-width="2.5" />

  <!-- Logo Icon: Modern Eco-Science Leaf & Sprout -->
  <g filter="url(#shadow)">
    <!-- Main Right Leaf -->
    <path
      d="M64 96 C64 96, 68 62, 98 42 C98 68, 86 92, 64 96 Z"
      fill="url(#leafGrad)"
    />

    <!-- Left Sprout Leaf -->
    <path
      d="M64 96 C64 80, 40 76, 30 54 C30 76, 48 94, 64 96 Z"
      fill="url(#accentGrad)"
    />

    <!-- Center Sprout Stem & Leaf Rib -->
    <path
      d="M64 96 Q64 68 96 44"
      fill="none"
      stroke="#3D4127"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.4"
    />

    <!-- Top Digital Bio-Droplet Node -->
    <circle cx="64" cy="30" r="7" fill="#FBFFF3" />
    <circle cx="64" cy="30" r="3.5" fill="#5B6628" />
  </g>
</svg>
